<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boldify Reading Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup" id="popup">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon">B</div>
        <div class="logo-text">
          <span class="logo-title">Boldify</span>
          <span class="logo-subtitle">Reading Assistant</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" title="Toggle theme">
          <svg class="icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="content">
      <!-- Enable Toggle -->
      <div class="toggle-card" id="toggleCard">
        <div class="toggle-info">
          <svg class="icon toggle-icon enabled-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="icon toggle-icon disabled-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
          <div>
            <p class="toggle-title" id="toggleTitle">Enable on this site</p>
            <p class="toggle-site" id="currentSite">Loading...</p>
          </div>
        </div>
        <button class="switch" id="enableToggle" role="switch" aria-checked="false">
          <span class="switch-thumb"></span>
        </button>
      </div>

      <!-- Intensity Slider -->
      <div class="setting-group">
        <div class="setting-header">
          <label class="setting-label" for="intensitySlider">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            Bold Intensity
          </label>
          <span class="setting-value" id="intensityValue">50%</span>
        </div>
        <input 
          type="range" 
          id="intensitySlider" 
          class="slider" 
          min="10" 
          max="90" 
          value="50"
          aria-label="Bold intensity"
        >
        <div class="slider-labels">
          <span>Subtle</span>
          <span>Strong</span>
        </div>
      </div>

      <!-- Italic Toggle -->
      <div class="setting-row">
        <div class="setting-info">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="4" x2="10" y2="4"></line>
            <line x1="14" y1="20" x2="5" y2="20"></line>
            <line x1="15" y1="4" x2="9" y2="20"></line>
          </svg>
          <span>Italic Mode</span>
        </div>
        <button class="switch small" id="italicToggle" role="switch" aria-checked="false">
          <span class="switch-thumb"></span>
        </button>
      </div>

      <!-- Fixation Presets -->
      <div class="setting-group">
        <label class="setting-label">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 7 4 4 20 4 20 7"></polyline>
            <line x1="9" y1="20" x2="15" y2="20"></line>
            <line x1="12" y1="4" x2="12" y2="20"></line>
          </svg>
          Fixation Strength
        </label>
        <div class="preset-buttons">
          <button class="preset-btn" data-intensity="30">Light</button>
          <button class="preset-btn active" data-intensity="50">Medium</button>
          <button class="preset-btn" data-intensity="75">Strong</button>
        </div>
      </div>

      <!-- Keyboard Shortcut Info -->
      <div class="shortcut-info">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
          <path d="M6 8h.001M10 8h.001M14 8h.001M18 8h.001M8 12h.001M12 12h.001M16 12h.001M6 16h12"></path>
        </svg>
        <span>Toggle: <kbd>Alt</kbd> + <kbd>B</kbd></span>
      </div>

      <!-- Stats -->
      <div class="stats">
        <div class="stat">
          <span class="stat-value" id="wordsToday">0</span>
          <span class="stat-label">Words today</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="pagesTotal">0</span>
          <span class="stat-label">Pages</span>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-info">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span>Works on all websites</span>
      </div>
      <span class="version">v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
